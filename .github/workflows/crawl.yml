name: 쿠폰 크롤러

on:
  schedule:
    - cron: '7 0 * * *'   # 09:07 KST — 폴링 루프 (11:30까지)
    - cron: '7 7 * * *'   # 16:07 KST — 저녁 폴링 루프 (18:30까지)
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 160
    steps:
      - uses: actions/checkout@v4

      - name: Python 세팅
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: Firebase 키 파일 생성
        run: |
          echo '${{ secrets.FIREBASE_KEY }}' > serviceAccountKey.json
          echo '${{ secrets.FIREBASE_KEY_DEV }}' > serviceAccountKey_dev.json

      - name: 크롤러 실행
        run: python main.py
